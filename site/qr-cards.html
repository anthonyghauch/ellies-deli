<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Ellie's Deli · QR Cards</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="brand.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  body { background: #e6ece9; font-size: 14px; line-height: 1.4; }

  /* on-screen controls (not printed) */
  .controls {
    max-width: 8.5in; margin: 16px auto; padding: 14px 16px; background: var(--white); border-radius: 12px;
    display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
  }
  .controls label { font-weight: 700; width: 100%; }
  .controls input { flex: 1; min-width: 220px; padding: 10px 12px; border: 1.5px solid var(--green-line); border-radius: 8px; }
  .controls input:focus { outline: none; border-color: var(--green); }
  .controls button { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--green); color: var(--white); font-weight: 700; cursor: pointer; }
  .controls small { width: 100%; color: var(--muted); }

  /* one US Letter page, 4 cards to cut out along the dashed lines */
  .page {
    width: 8.5in; height: 11in; margin: 0 auto 24px; background: var(--white);
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; box-shadow: 0 4px 24px rgba(0,0,0,.12);
  }
  .card { display: flex; flex-direction: column; align-items: center; padding: .28in .3in .24in; border: 1px dashed #b9c9c2; text-align: center; }
  .card .head { width: 100%; background: var(--green); border-radius: 12px; padding: .1in; }
  .card .plaque { padding: .1in .08in .09in; border-width: 2px; }
  .card .plaque .logo { font-size: 30px; }
  .card .plaque .ln + .ln { margin-top: 5px; }
  .card .what { margin-top: 7px; color: var(--tan); font: 700 13px/1 var(--body); letter-spacing: .14em; }
  .card .qr { width: 2.55in; height: 2.55in; margin: .17in 0 .1in; }
  .card .qr svg { width: 100%; height: 100%; display: block; }
  .card .qr .empty { color: var(--muted); font-size: 13px; padding-top: 1in; }
  .card .scan { font: 700 19px/1.1 var(--display); letter-spacing: .04em; color: var(--green); }
  .card .url { margin-top: 4px; font-size: 11.5px; font-weight: 700; color: var(--green); }
  .card .note { margin-top: 3px; font-size: 11px; color: var(--muted); }

  /* ?clean=1 shows just the page (used to make the PNG version) */
  body.clean { background: var(--white); }
  body.clean .controls, body.clean .demo-bar { display: none; }
  body.clean .page { margin: 0; box-shadow: none; zoom: 1 !important; }

  @media print {
    @page { size: letter; margin: 0; }
    body { background: var(--white); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .controls, .demo-bar { display: none; }
    .page { margin: 0; box-shadow: none; }
  }
  @media screen and (max-width: 8.6in) {
    .page { zoom: .5; }
  }
</style>
</head>
<body>

<div class="controls">
  <label for="url">Link for the QR codes</label>
  <input id="url" type="url" placeholder="https://anthonyghauch.github.io/ellies-deli/">
  <button type="button" onclick="window.print()">Print</button>
  <small>Prints 4 cards on one letter page. Cut along the dashed lines.</small>
</div>

<div class="page" id="page"></div>

<script>
const CARD = `
  <div class="card">
    <div class="head">
      <div class="plaque">
        <div class="logo" role="img" aria-label="Ellie's Deli">
          <div class="ln" aria-hidden="true">ELL<i class="paddle"></i>E’S</div>
          <div class="ln" aria-hidden="true">DEL<i class="paddle"></i></div>
        </div>
        <div class="what">ORDER ONLINE</div>
      </div>
    </div>
    <div class="qr"></div>
    <div class="scan">Scan to order</div>
    <div class="url"></div>
    <div class="note">Pick up &amp; pay in the basement · All profits go to charity</div>
  </div>`;
document.getElementById('page').innerHTML = CARD.repeat(4);

const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const input = document.getElementById('url');
if (new URLSearchParams(location.search).has('clean')) document.body.classList.add('clean');

function draw() {
  const url = input.value.trim();
  const shown = url.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, '');
  let svg = '<div class="empty">Paste your link above</div>';
  if (url && typeof qrcode !== 'undefined') {
    const qr = qrcode(0, 'Q');
    qr.addData(url);
    qr.make();
    svg = qr.createSvgTag({ cellSize: 8, margin: 0, scalable: true }).replace(/fill="black"/g, 'fill="#0a3d30"');
  }
  document.querySelectorAll('.card .qr').forEach(el => { el.innerHTML = svg; });
  document.querySelectorAll('.card .url').forEach(el => { el.textContent = shown; });
}

// Default: ?url=…, otherwise this site's own home page when hosted
const home = /^https?:$/.test(location.protocol) ? location.origin + location.pathname.replace(/qr-cards\.html$/, '') : '';
input.value = new URLSearchParams(location.search).get('url') || home;
input.addEventListener('input', draw);
draw();
</script>
</body>
</html>
